[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-puzzle-mate-generator"
version = "0.1.0"
description = "模块化海龟汤题目生成与审核"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["code/core_engine"]
include = ["puzzle_generator*"]

[tool.setuptools.package-data]
puzzle_generator = ["skills/*/SKILL.md"]
