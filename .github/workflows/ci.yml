name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEMO_MODE: 'true'
  PYTHONUTF8: '1'

jobs:
  backend:
    name: Backend tests and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.lock
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Run backend tests
        run: .venv/bin/python -m pytest --junitxml=test-results/pytest.xml
      - name: Evaluate teammate quality in demo mode
        run: .venv/bin/python scripts/evaluate_teammates.py
      - name: Check OpenAPI snapshot
        run: |
          .venv/bin/python scripts/export_openapi.py
          git diff --exit-code -- docs/software/openapi.json
      - name: Upload backend test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: code/module4_frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/module4_frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            pyproject.toml
      - name: Install backend for browser tests
        working-directory: .
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.lock
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend unit tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Install Chrome and system dependencies
        run: npx playwright install --with-deps chrome
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload browser reports and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            code/module4_frontend/playwright-report/
            code/module4_frontend/test-results/
            data/verification/*.png
          if-no-files-found: ignore
          retention-days: 7
